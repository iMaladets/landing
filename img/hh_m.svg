<svg width="100%" height="100%" viewBox="0 0 450 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <style>
    /* Yellow Color Palette: #FFD700 */
    .chart-line-vertical {
      fill: none;
      stroke: #FFD700;
      stroke-width: 3;
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: drawLineVertical 5s ease-out infinite;
      opacity: 0.8;
    }
    .chart-bar-vertical {
      fill: #FFD700;
      opacity: 0.6;
      /* Important for vertical growth from the bottom */
      transform-origin: bottom;
      animation: growBarVertical 4s ease-in-out infinite alternate;
    }
    .chart-pie-top {
      fill: none;
      stroke: #FFD700;
      stroke-width: 25;
      opacity: 0.5;
      animation: rotatePie 8s linear infinite;
      transform-origin: 225px 150px; /* Centered on the circle's position */
    }

    /* Animations */
    @keyframes drawLineVertical {
      to {
        stroke-dashoffset: 0;
      }
    }
    @keyframes growBarVertical {
      from {
        transform: scaleY(0.1);
      }
      to {
        transform: scaleY(1);
      }
    }
    @keyframes rotatePie {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  <g>
    <circle class="chart-pie-top" cx="225" cy="150" r="60" stroke-dasharray="120 200" />

    <path class="chart-line-vertical" d="M 30 750 L 120 620 L 180 660 L 300 400 L 360 450 L 420 250" />

    <rect class="chart-bar-vertical" x="50" y="600" width="40" height="200" style="animation-delay: 0.2s;" />
    <rect class="chart-bar-vertical" x="150" y="350" width="40" height="450" style="animation-delay: 0.5s;" />
    <rect class="chart-bar-vertical" x="250" y="450" width="40" height="350" style="animation-delay: 0.8s;" />
     <rect class="chart-bar-vertical" x="350" y="200" width="40" height="600" style="animation-delay: 1.1s;" />
  </g>
</svg>