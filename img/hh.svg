<svg width="100%" height="100%" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <style>
    .chart-line {
      fill: none;
      stroke: #FFD700;
      stroke-width: 2;
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: drawLine 4s linear infinite;
    }
    .chart-bar {
      fill: #FFD700;
      opacity: 0.7;
      animation: growBar 3s ease-in-out infinite alternate;
    }
    .chart-pie-segment {
      fill: none;
      stroke: #FFD700;
      stroke-width: 20;
      animation: rotatePie 5s linear infinite;
      transform-origin: center;
    }
    @keyframes drawLine {
      to {
        stroke-dashoffset: 0;
      }
    }
    @keyframes growBar {
      from {
        transform: scaleY(0);
      }
      to {
        transform: scaleY(1);
      }
    }
    @keyframes rotatePie {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
  <g opacity="0.5">
    <path class="chart-line" d="M 50 350 L 150 250 L 250 300 L 350 150 L 450 200 L 550 100" />
    <rect class="chart-bar" x="600" y="250" width="30" height="100" />
    <rect class="chart-bar" x="650" y="150" width="30" height="200" style="animation-delay: 1s;" />
    <rect class="chart-bar" x="700" y="200" width="30" height="150" style="animation-delay: 0.5s;" />
    <circle class="chart-pie-segment" cx="150" cy="100" r="40" stroke-dasharray="100 150" />
  </g>
</svg>